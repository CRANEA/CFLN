<!-- Crane Financial Contact Form -->
<form id="contactForm">
  <div style="margin-bottom: 10px;">
    <label>Name</label><br>
    <input type="text" name="name" required style="width: 100%; max-width: 400px;">
  </div>
  
  <div style="margin-bottom: 10px;">
    <label>Email</label><br>
    <input type="email" name="email" required style="width: 100%; max-width: 400px;">
  </div>
  
  <div style="margin-bottom: 10px;">
    <label>Message</label><br>
    <textarea name="message" rows="4" required style="width: 100%; max-width: 400px;"></textarea>
  </div>

  <!-- The Anti-Spam Math Question -->
  <div style="margin-bottom: 15px; padding: 10px; background-color: #f9f9f9; border: 1px solid #ccc; max-width: 400px;">
    <label for="spamAnswer"><strong>Spam Check: What is 4 + 5?</strong></label><br>
    <input type="text" id="spamAnswer" name="spamAnswer" required placeholder="Enter the number" style="width: 100%;">
  </div>

  <button type="submit" style="padding: 10px 20px; cursor: pointer;">Send Message</button>
</form>

<!-- This is where success or error messages will appear -->
<div id="formMessage" style="margin-top: 15px; font-weight: bold;"></div>

<!-- The JavaScript that powers the submission -->
<script>
  const form = document.getElementById('contactForm');
  const messageDiv = document.getElementById('formMessage');
  
  // Your brand new Google Apps Script URL
  const scriptURL = 'https://script.google.com/macros/s/AKfycbwXwW0PNe0GdjzyiExwtM6Nk576SUs8GiCTqh4rml3CRK3mvpK8DdttUlZoTeHHdIqS/exec';

  form.addEventListener('submit', e => {
    e.preventDefault(); // Prevents the page from reloading
    
    // 1. Check the math answer first
    const spamInput = document.getElementById('spamAnswer').value.trim();
    if (spamInput !== '9') {
      messageDiv.innerHTML = "Incorrect math answer. Please try again.";
      messageDiv.style.color = "red";
      return; // Stops the bot right here
    }

    // 2. If the answer is 9, send the data
    messageDiv.innerHTML = "Sending...";
    messageDiv.style.color = "blue";

    fetch(scriptURL, { method: 'POST', body: new FormData(form) })
      .then(response => {
        messageDiv.innerHTML = "Success! Your message has been sent.";
        messageDiv.style.color = "green";
        form.reset(); // Clears the form for the next user
      })
      .catch(error => {
        messageDiv.innerHTML = "Error! Something went wrong.";
        messageDiv.style.color = "red";
        console.error('Error!', error.message);
      });
  });
</script>
